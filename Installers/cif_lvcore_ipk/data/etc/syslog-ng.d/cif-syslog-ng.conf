#CIF Log configuration file for syslog-ng config
#This needs to be placed in /etc/syslog-ng.d
#Documentation can be found here:  https://github.com/balabit/syslog-ng-3.5/blob/master/debian/syslog-ng.conf
#Documentation can be found on the target here: /etc/syslog-ng/syslog-ng.conf
#libc documentation can be found here:  https://www.gnu.org/software/libc/manual/pdf/libc.pdf
#To test and debug calling /etc/init.d/syslog start will restart and print any parsing errors

options {
    keep-hostname(no);
    owner("lvuser");
    group("ni");
    perm(0666);
    dir_perm(0666);
};

template ciflog {
    template("$MONTH/$DAY/$YEAR $HOUR:$MIN:$SEC	$MSGONLY\n");
    template_escape(no); 
};

destination cif_error {
    file("/var/local/cif/logs/cif_error.log"
        template(ciflog)
        time_zone("UTC")
    ); 
};

destination cif_config {
    file("/var/local/cif/logs/cif_config.log"
        template(ciflog)
        time_zone("UTC")
    ); 
};

destination cif_info {
    file("/var/local/cif/logs/cif_info.log"
        template(ciflog)
        time_zone("UTC")
    ); 
};

filter f_cif_error { 
    facility(local5);
    level(err);
    match("cif" value("MSGHDR"));
};

filter f_cif_config { 
    facility(local5);
    level(notice);
    match("cif" value("MSGHDR"));
};

filter f_cif_info { 
    facility(local5);
    level(info,);
    match("cif" value("MSGHDR"));
};

log { 
    source(src);
    filter(f_cif_error);
    destination(cif_error);
};

log { 
    source(src);
    filter(f_cif_config);
    destination(cif_config);
};

log {
    source(src);
    filter(f_cif_info);
    destination(cif_info);
};
